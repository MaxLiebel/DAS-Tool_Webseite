project:
  type: website
  output-dir: docs

website:
  title: "DAS-Tool"
  page-footer:
    center:
      - href: impressum.qmd
        text: "Impressum"
      - href: datenschutz.qmd
        text: "Datenschutz"
      - text: "{{< iconify bxl:creative-commons size=xl >}} {{< iconify humbleicons:creative-commons-by size=xl >}}"
        href: "https://creativecommons.org/licenses/by/4.0/deed.en"
      - text: "Sofern nicht anders angegeben, ist der Inhalt dieser Website unter einer Creative Commons Namensnennung 4.0 International Lizenz lizenziert."
  navbar:
    logo: /images/logo-dark.png
    left:
      - text: "Über das Projekt"
        menu:
          - partners.qmd
          - arbeitspakete.qmd
      - href: publications.qmd
        text: "Publikationen"
      - text: "Veranstaltungen"
        menu:
          - events.qmd
          - archive.qmd
      - href: ressourcen.qmd
        text: "Ressourcen"
    tools:
      - icon: mastodon
      - icon: envelope
      - icon: github

format:
  html:
    theme:
      light: [flatly, light-theme.scss]
      dark: [darkly, dark-theme.scss]
    css: styles.css
    grid:
      sidebar-width: 50px
      body-width: 850px
      margin-width: 150px